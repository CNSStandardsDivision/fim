<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNS-FIM Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --line: #E6DED2;
    --ink: #1F2A36;
    --text: #2E2A26;
    --muted: #6F665D;
    --accent: #9A7B4F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 40px 32px;
    text-align: center;
  }
  .rule {
    width: 48px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 24px;
  }
  .code {
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: "Noto Serif Thai", serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .sub {
    color: var(--muted);
    margin: 0 0 28px;
  }
  .status {
    display: inline-block;
    font-size: 14px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="rule"></div>
  <p class="code">CNS-FIM</p>
  <h1>Flight Inspection Management</h1>
  <p class="sub">ระบบติดตามผลการบินทดสอบเครื่องช่วยการเดินอากาศ</p>
  <span class="status">อยู่ระหว่างพัฒนา · เปิดใช้งาน พฤศจิกายน 2569</span>
  <footer>กอง NA · สำนักงานการบินพลเรือนแห่งประเทศไทย</footer>
</main>
</body>
</html>
